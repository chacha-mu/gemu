<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Space Shooter</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; color: #fff; font-family: sans-serif; }
        canvas { display: block; margin: 0 auto; background: #050510; }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="480" height="640"></canvas>

<script>const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// 画像読み込み
const playerImg = new Image(); playerImg.src = "player.jpg?v=999";
const enemyNormalImg = new Image(); enemyNormalImg.src = "enemey.jpg?v=999";
const enemyHardImg = new Image(); enemyHardImg.src = "yousai.png?v=999";
const enemyFastImg = new Image(); enemyFastImg.src = "speed.png?v=999";

// ゲーム変数
let score = 0;
let currentWave = 1;
let enemies = [];
let bullets = [];
let enemyBullets = []; // 敵の弾
let isGameOver = false;
let isClear = false;

const player = { x: 216, y: 560, w: 48, h: 48, speed: 5 };

// キー操作
const keys = {};
window.addEventListener("keydown", e => keys[e.code] = true);
window.addEventListener("keyup", e => keys[e.code] = false);

// 敵タイプ（サイズを大きく調整）
const TYPES = {
    NORMAL: { img: enemyNormalImg, hp: 2, speed: 1.8, w: 56, h: 56, score: 100, shootRate: 0.01 },
    HARD:   { img: enemyHardImg,   hp: 8, speed: 0.8, w: 80, h: 80, score: 300, shootRate: 0.02 },
    FAST:   { img: enemyFastImg,   hp: 1, speed: 4.0, w: 48, h: 48, score: 200, shootRate: 0.005 },
    BOSS:   { img: enemyHardImg,   hp: 35, speed: 0.6, w: 120, h: 120, score: 1000, shootRate: 0.05 }
};

// ウェーブデータ（1〜5）
const WAVES = {
    1: [TYPES.NORMAL, TYPES.NORMAL, TYPES.NORMAL],
    2: [TYPES.NORMAL, TYPES.NORMAL, TYPES.HARD],
    3: [TYPES.NORMAL, TYPES.FAST, TYPES.FAST],
    4: [TYPES.HARD, TYPES.FAST, TYPES.HARD, TYPES.FAST],
    5: [TYPES.BOSS]
};

function spawnWave(waveNum) {
    const list = WAVES[waveNum];
    if (!list) return;
    
    list.forEach((type, index) => {
        enemies.push({
            img: type.img,
            hp: type.hp,
            speed: type.speed,
            w: type.w,
            h: type.h,
            score: type.score,
            shootRate: type.shootRate,
            x: Math.random() * (canvas.width - type.w),
            y: -100 - (index * 100)
        });
    });
}

let lastShootTime = 0;
const SHOOT_INTERVAL = 250; // プレイヤーの連射間隔（ミリ秒）: 値を大きくすると難しくなります

function update() {
    if (isGameOver || isClear) return;

    // プレイヤー移動
    if (keys["ArrowLeft"] && player.x > 0) player.x -= player.speed;
    if (keys["ArrowRight"] && player.x < canvas.width - player.w) player.x += player.speed;
    
    // 自機ショット（連射制限付き）
    const now = Date.now();
    if (keys["Space"] && now - lastShootTime > SHOOT_INTERVAL) {
        bullets.push({ x: player.x + player.w/2 - 3, y: player.y, w: 6, h: 14, speed: 8 });
        lastShootTime = now;
    }

    // 自機弾の移動
    for (let bi = bullets.length - 1; bi >= 0; bi--) {
        const b = bullets[bi];
        b.y -= b.speed;
        if (b.y < -10) bullets.splice(bi, 1);
    }

    // 敵の移動・攻撃・ヒット判定
    for (let ei = enemies.length - 1; ei >= 0; ei--) {
        const e = enemies[ei];
        e.y += e.speed;

        if (e.y > canvas.height) e.y = -e.h;

        // 敵の攻撃確率判定
        if (Math.random() < e.shootRate && e.y > 0) {
            enemyBullets.push({
                x: e.x + e.w / 2 - 4,
                y: e.y + e.h,
                w: 8,
                h: 12,
                speed: 4
            });
        }

        // プレイヤーの弾との当たり判定
        for (let bi = bullets.length - 1; bi >= 0; bi--) {
            const b = bullets[bi];
            if (b.x < e.x + e.w && b.x + b.w > e.x &&
                b.y < e.y + e.h && b.y + b.h > e.y) {
                
                bullets.splice(bi, 1);
                e.hp--;

                if (e.hp <= 0) {
                    score += e.score;
                    enemies.splice(ei, 1);
                    break;
                }
            }
        }
    }

    // 敵弾の移動と自機への当たり判定
    for (let ebi = enemyBullets.length - 1; ebi >= 0; ebi--) {
        const eb = enemyBullets[ebi];
        eb.y += eb.speed;

        // 画面外処理
        if (eb.y > canvas.height) {
            enemyBullets.splice(ebi, 1);
            continue;
        }

        // 自機とのヒット判定（ゲームオーバー）
        if (eb.x < player.x + player.w && eb.x + eb.w > player.x &&
            eb.y < player.y + player.h && eb.y + eb.h > player.y) {
            isGameOver = true;
        }
    }

    // ウェーブ進行判定
    if (enemies.length === 0) {
        if (currentWave < 5) {
            currentWave++;
            spawnWave(currentWave);
        } else {
            isClear = true;
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (isGameOver) {
        ctx.fillStyle = "#ff0000";
        ctx.font = "36px sans-serif";
        ctx.fillText("GAME OVER", 130, 320);
        return;
    }

    // プレイヤー描画
    ctx.drawImage(playerImg, player.x, player.y, player.w, player.h);

    // 自分の弾（水色）
    ctx.fillStyle = "#00ffff";
    bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

    // 敵の弾（赤色）
    ctx.fillStyle = "#ff0055";
    enemyBullets.forEach(eb => ctx.fillRect(eb.x, eb.y, eb.w, eb.h));

    // 敵描画
    enemies.forEach(e => ctx.drawImage(e.img, e.x, e.y, e.w, e.h));

    // UI描画
    ctx.fillStyle = "#fff";
    ctx.font = "16px sans-serif";
    ctx.fillText(`SCORE: ${score}`, 10, 25);
    ctx.fillText(`WAVE: ${currentWave} / 5`, 10, 50);

    if (isClear) {
        ctx.fillStyle = "#00ff00";
        ctx.font = "36px sans-serif";
        ctx.fillText("ALL CLEAR!!", 140, 320);
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

spawnWave(1);
gameLoop();
</script>
</body>
</html>
