<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>SUPER SPACE SHOOTER</title>
    <style>
        body {
            margin: 0;
            background-color: #050515;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.4);
            border: 2px solid #00e5ff;
            border-radius: 8px;
            overflow: hidden;
        }

        canvas {
            background: radial-gradient(circle at center, #0b0c2a 0%, #020208 100%);
            display: block;
        }

        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            font-weight: bold;
            color: #00e5ff;
            text-shadow: 0 0 8px #00e5ff;
            pointer-events: none;
        }

        #hp-bar-container {
            width: 100px;
            height: 12px;
            border: 2px solid #00e5ff;
            border-radius: 6px;
            overflow: hidden;
            background: #222;
        }

        #hp-bar {
            width: 100%;
            height: 100%;
            background: #00ff66;
            transition: width 0.2s;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui">
            <div>SCORE: <span id="score">0</span></div>
            <div style="display: flex; align-items: center; gap: 8px;">
                HP:
                <div id="hp-bar-container">
                    <div id="hp-bar"></div>
                </div>
            </div>
        </div>
        <canvas id="canvas" width="400" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const hpBar = document.getElementById("hp-bar");
const playerImg = new Image();
playerImg.src = "player.jpg?v=999"; // png を jpg に変更！

const enemyImg = new Image();
enemyImg.src = "enemy.jpg?v=999";   // png を jpg に変更！
        let score = 0;
        let gameOver = false;

        const player = {
            x: canvas.width / 2 - 20,
            y: canvas.height - 60,
            width: 40,
            height: 40,
            speed: 5,
            maxHp: 5,
            hp: 5
        };

        const keys = {};
        const bullets = [];
        const enemies = [];
        const particles = [];
        const stars = [];

        for (let i = 0; i < 50; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speed: Math.random() * 2 + 0.5
            });
        }

        document.addEventListener("keydown", (e) => keys[e.key] = true);
        document.addEventListener("keyup", (e) => keys[e.key] = false);

        let canShoot = true;
        document.addEventListener("keydown", (e) => {
            if (e.key === " " && canShoot && !gameOver) {
                bullets.push({
                    x: player.x + player.width / 2 - 3,
                    y: player.y,
                    width: 6,
                    height: 14
                });
                canShoot = false;
            }
        });
        document.addEventListener("keyup", (e) => {
            if (e.key === " ") canShoot = true;
        });

        setInterval(() => {
            if (!gameOver) {
                enemies.push({
                    x: Math.random() * (canvas.width - 35),
                    y: -35,
                    width: 35,
                    height: 35,
                    speed: Math.random() * 2 + 1.5
                });
            }
        }, 800);

        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    size: Math.random() * 4 + 2,
                    color: color,
                    life: 20
                });
            }
        }

        function update() {
            if (gameOver) return;

            if ((keys["ArrowLeft"] || keys["a"]) && player.x > 0) player.x -= player.speed;
            if ((keys["ArrowRight"] || keys["d"]) && player.x < canvas.width - player.width) player.x += player.speed;

            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) star.y = 0;
            });

            bullets.forEach((bullet, index) => {
                bullet.y -= 8;
                if (bullet.y < 0) bullets.splice(index, 1);
            });

            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(index, 1);
            });

            enemies.forEach((enemy, eIndex) => {
                enemy.y += enemy.speed;

                bullets.forEach((bullet, bIndex) => {
                    if (
                        bullet.x < enemy.x + enemy.width &&
                        bullet.x + bullet.width > enemy.x &&
                        bullet.y < enemy.y + enemy.height &&
                        bullet.y + bullet.height > enemy.y
                    ) {
                        createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, "#ffcc00");
                        enemies.splice(eIndex, 1);
                        bullets.splice(bIndex, 1);
                        score += 100;
                        scoreEl.innerText = score;
                    }
                });

                if (
                    player.x < enemy.x + enemy.width &&
                    player.x + player.width > enemy.x &&
                    player.y < enemy.y + enemy.height &&
                    player.y + player.height > enemy.y
                ) {
                    createExplosion(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, "#ff0055");
                    enemies.splice(eIndex, 1);
                    player.hp--;

                    const hpPercent = (player.hp / player.maxHp) * 100;
                    hpBar.style.width = Math.max(0, hpPercent) + "%";
                    if (hpPercent < 30) hpBar.style.background = "#ff0055";

                    if (player.hp <= 0) {
                        gameOver = true;
                        alert("GAME OVER! スコア: " + score);
                        document.location.reload();
                    }
                }

                if (enemy.y > canvas.height) enemies.splice(eIndex, 1);
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            stars.forEach(star => {
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });

            // 自機の描画
            if (playerImg.complete && playerImg.naturalWidth !== 0) {
                ctx.drawImage(playerImg, player.x, player.y, player.width, player.height);
            } else {
                ctx.fillStyle = "#00e5ff";
                ctx.beginPath();
                ctx.moveTo(player.x + player.width / 2, player.y);
                ctx.lineTo(player.x, player.y + player.height);
                ctx.lineTo(player.x + player.width, player.y + player.height);
                ctx.closePath();
                ctx.fill();
            }

            // 敵の描画
            enemies.forEach(enemy => {
                if (enemyImg.complete && enemyImg.naturalWidth !== 0) {
                    ctx.drawImage(enemyImg, enemy.x, enemy.y, enemy.width, enemy.height);
                } else {
                    ctx.fillStyle = "#ff3366";
                    ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
                }
            });

            ctx.fillStyle = "#ff007f";
            bullets.forEach(bullet => ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height));

            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
            });
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
