<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Space Shooter</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; color: #fff; font-family: sans-serif; }
        canvas { display: block; margin: 0 auto; background: #050510; }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="480" height="640"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// 画像読み込み
const playerImg = new Image(); playerImg.src = "player.jpg?v=999";
const enemyNormalImg = new Image(); enemyNormalImg.src = "enemey.jpg?v=999";
const enemyHardImg = new Image(); enemyHardImg.src = "yousai.png?v=999";
const enemyFastImg = new Image(); enemyFastImg.src = "speed.png?v=999";

// ゲーム変数
let score = 0;
let currentWave = 1;
let enemies = [];
let bullets = [];
let isGameOver = false;
let isClear = false;

const player = { x: 216, y: 560, w: 48, h: 48, speed: 5 };

// キー操作
const keys = {};
window.addEventListener("keydown", e => keys[e.code] = true);
window.addEventListener("keyup", e => keys[e.code] = false);

// 敵タイプ
const TYPES = {
    NORMAL: { img: enemyNormalImg, hp: 1, speed: 2, w: 40, h: 40, score: 100 },
    HARD:   { img: enemyHardImg,   hp: 5, speed: 1, w: 56, h: 56, score: 300 },
    FAST:   { img: enemyFastImg,   hp: 1, speed: 4.5, w: 36, h: 36, score: 200 },
    BOSS:   { img: enemyHardImg,   hp: 25, speed: 0.8, w: 96, h: 96, score: 1000 }
};

// ウェーブデータ（1〜5）
const WAVES = {
    1: [TYPES.NORMAL, TYPES.NORMAL, TYPES.NORMAL],
    2: [TYPES.NORMAL, TYPES.NORMAL, TYPES.HARD],
    3: [TYPES.NORMAL, TYPES.FAST, TYPES.FAST],
    4: [TYPES.HARD, TYPES.FAST, TYPES.HARD, TYPES.FAST],
    5: [TYPES.BOSS]
};

function spawnWave(waveNum) {
    const list = WAVES[waveNum];
    if (!list) return;
    
    list.forEach((type, index) => {
        enemies.push({
            img: type.img,
            hp: type.hp,
            speed: type.speed,
            w: type.w,
            h: type.h,
            score: type.score,
            x: Math.random() * (canvas.width - type.w),
            y: -60 - (index * 80)
        });
    });
}

let shootTimer = 0;

function update() {
    if (isGameOver || isClear) return;

    // 移動
    if (keys["ArrowLeft"] && player.x > 0) player.x -= player.speed;
    if (keys["ArrowRight"] && player.x < canvas.width - player.w) player.x += player.speed;
    
    // 発射 (Spaceキー)
    if (keys["Space"] && shootTimer % 8 === 0) {
        bullets.push({ x: player.x + player.w/2 - 3, y: player.y, w: 6, h: 12, speed: 8 });
    }
    shootTimer++;

    // 弾更新
    for (let bi = bullets.length - 1; bi >= 0; bi--) {
        const b = bullets[bi];
        b.y -= b.speed;
        if (b.y < -10) bullets.splice(bi, 1);
    }

    // 敵更新
    for (let ei = enemies.length - 1; ei >= 0; ei--) {
        const e = enemies[ei];
        e.y += e.speed;

        if (e.y > canvas.height) e.y = -e.h;

        // 弾と敵のヒット判定
        for (let bi = bullets.length - 1; bi >= 0; bi--) {
            const b = bullets[bi];
            if (b.x < e.x + e.w && b.x + b.w > e.x &&
                b.y < e.y + e.h && b.y + b.h > e.y) {
                
                bullets.splice(bi, 1);
                e.hp--;

                if (e.hp <= 0) {
                    score += e.score;
                    enemies.splice(ei, 1);
                    break;
                }
            }
        }
    }

    // 次のウェーブ
    if (enemies.length === 0) {
        if (currentWave < 5) {
            currentWave++;
            spawnWave(currentWave);
        } else {
            isClear = true;
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // プレイヤー
    ctx.drawImage(playerImg, player.x, player.y, player.w, player.h);

    // 弾
    ctx.fillStyle = "#00ffff";
    bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

    // 敵
    enemies.forEach(e => ctx.drawImage(e.img, e.x, e.y, e.w, e.h));

    // UI
    ctx.fillStyle = "#fff";
    ctx.font = "16px sans-serif";
    ctx.fillText(`SCORE: ${score}`, 10, 25);
    ctx.fillText(`WAVE: ${currentWave} / 5`, 10, 50);

    if (isClear) {
        ctx.fillStyle = "#00ff00";
        ctx.font = "32px sans-serif";
        ctx.fillText("ALL CLEAR!!", 150, 320);
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

spawnWave(1);
gameLoop();
</script>
</body>
</html>
