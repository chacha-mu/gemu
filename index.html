<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Space Shooter</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; color: #fff; font-family: sans-serif; }
        canvas { display: block; margin: 0 auto; background: #050510; }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="480" height="640"></canvas>

<script>const canvas = document.getElementById("gameCanvas");
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// 画像読み込み
const playerImg = new Image(); playerImg.src = "player.jpg?v=999";
const enemyNormalImg = new Image(); enemyNormalImg.src = "enemey.jpg?v=999";
const enemyHardImg = new Image(); enemyHardImg.src = "yousai.png?v=999";
const enemyFastImg = new Image(); enemyFastImg.src = "speed.png?v=999";

// ゲーム変数
let score = 0;
let currentWave = 1;
let enemies = [];
let bullets = [];
let enemyBullets = [];
let isGameOver = false;
let isClear = false;

const player = { x: 216, y: 560, w: 48, h: 48, speed: 5 };

// キー操作
const keys = {};
window.addEventListener("keydown", e => keys[e.code] = true);
window.addEventListener("keyup", e => keys[e.code] = false);

// 敵タイプ
const TYPES = {
    NORMAL: { img: enemyNormalImg, hp: 2, speed: 1.8, w: 56, h: 56, score: 100, shootRate: 0.01, isBoss: false },
    HARD:   { img: enemyHardImg,   hp: 8, speed: 0.8, w: 80, h: 80, score: 300, shootRate: 0.02, isBoss: false },
    FAST:   { img: enemyFastImg,   hp: 1, speed: 4.0, w: 48, h: 48, score: 200, shootRate: 0.005, isBoss: false },
    BOSS:   { img: enemyHardImg,   hp: 80, speed: 2, w: 140, h: 140, score: 3000, shootRate: 0.08, isBoss: true }
};

// ウェーブデータ
const WAVES = {
    1: [TYPES.NORMAL, TYPES.NORMAL, TYPES.NORMAL],
    2: [TYPES.NORMAL, TYPES.NORMAL, TYPES.HARD],
    3: [TYPES.NORMAL, TYPES.FAST, TYPES.FAST],
    4: [TYPES.HARD, TYPES.FAST, TYPES.HARD, TYPES.FAST],
    5: [TYPES.BOSS]
};

function spawnWave(waveNum) {
    const list = WAVES[waveNum];
    if (!list) return;
    
    list.forEach((type, index) => {
        enemies.push({
            img: type.img,
            hp: type.hp,
            maxHp: type.hp,
            speed: type.speed,
            w: type.w,
            h: type.h,
            score: type.score,
            shootRate: type.shootRate,
            isBoss: type.isBoss,
            vx: type.speed, // ボスの左右移動用
            x: type.isBoss ? (canvas.width / 2 - type.w / 2) : Math.random() * (canvas.width - type.w),
            y: type.isBoss ? -150 : -100 - (index * 100)
        });
    });
}

let lastShootTime = 0;
const SHOOT_INTERVAL = 200;

function update() {
    if (isGameOver || isClear) return;

    // プレイヤー移動
    if (keys["ArrowLeft"] && player.x > 0) player.x -= player.speed;
    if (keys["ArrowRight"] && player.x < canvas.width - player.w) player.x += player.speed;
    
    // 自機ショット
    const now = Date.now();
    if (keys["Space"] && now - lastShootTime > SHOOT_INTERVAL) {
        bullets.push({ x: player.x + player.w/2 - 3, y: player.y, w: 6, h: 14, speed: 8 });
        lastShootTime = now;
    }

    // 自機弾の移動
    for (let bi = bullets.length - 1; bi >= 0; bi--) {
        const b = bullets[bi];
        b.y -= b.speed;
        if (b.y < -10) bullets.splice(bi, 1);
    }

    // 敵の移動・攻撃・ヒット判定
    for (let ei = enemies.length - 1; ei >= 0; ei--) {
        const e = enemies[ei];

        if (e.isBoss) {
            // ボス専用の動き：上部に進入して固定＆左右往復
            if (e.y < 40) {
                e.y += 1;
            } else {
                e.x += e.vx;
                if (e.x <= 10 || e.x + e.w >= canvas.width - 10) {
                    e.vx *= -1; // 端で折り返し
                }
            }

            // ボスの広範囲攻撃（3方向ショット）
            if (Math.random() < e.shootRate && e.y >= 40) {
                const centerX = e.x + e.w / 2;
                const bottomY = e.y + e.h;
                enemyBullets.push({ x: centerX - 4, y: bottomY, vx: 0, vy: 4, w: 8, h: 12 });
                enemyBullets.push({ x: centerX - 4, y: bottomY, vx: -1.5, vy: 3.8, w: 8, h: 12 });
                enemyBullets.push({ x: centerX - 4, y: bottomY, vx: 1.5, vy: 3.8, w: 8, h: 12 });
            }
        } else {
            // 通常敵の動き
            e.y += e.speed;
            if (e.y > canvas.height) e.y = -e.h;

            if (Math.random() < e.shootRate && e.y > 0) {
                enemyBullets.push({ x: e.x + e.w / 2 - 4, y: e.y + e.h, vx: 0, vy: 4, w: 8, h: 12 });
            }
        }

        // 弾と敵のヒット判定
        for (let bi = bullets.length - 1; bi >= 0; bi--) {
            const b = bullets[bi];
            if (b.x < e.x + e.w && b.x + b.w > e.x &&
                b.y < e.y + e.h && b.y + b.h > e.y) {
                
                bullets.splice(bi, 1);
                e.hp--;

                if (e.hp <= 0) {
                    score += e.score;
                    enemies.splice(ei, 1);
                    break;
                }
            }
        }
    }

    // 敵弾の移動と判定
    for (let ebi = enemyBullets.length - 1; ebi >= 0; ebi--) {
        const eb = enemyBullets[ebi];
        eb.x += eb.vx;
        eb.y += eb.vy;

        if (eb.y > canvas.height || eb.x < 0 || eb.x > canvas.width) {
            enemyBullets.splice(ebi, 1);
            continue;
        }

        if (eb.x < player.x + player.w && eb.x + eb.w > player.x &&
            eb.y < player.y + player.h && eb.y + eb.h > player.y) {
            isGameOver = true;
        }
    }

    // ウェーブ進行判定
    if (enemies.length === 0) {
        if (currentWave < 5) {
            currentWave++;
            spawnWave(currentWave);
        } else {
            isClear = true;
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (isGameOver) {
        ctx.fillStyle = "#ff0000";
        ctx.font = "36px sans-serif";
        ctx.fillText("GAME OVER", 130, 320);
        return;
    }

    // プレイヤー描画
    ctx.drawImage(playerImg, player.x, player.y, player.w, player.h);

    // 自分の弾
    ctx.fillStyle = "#00ffff";
    bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

    // 敵の弾
    ctx.fillStyle = "#ff0055";
    enemyBullets.forEach(eb => ctx.fillRect(eb.x, eb.y, eb.w, eb.h));

    // 敵描画
    enemies.forEach(e => {
        ctx.drawImage(e.img, e.x, e.y, e.w, e.h);

        // ボスのHPバー描画
        if (e.isBoss && e.y >= 40) {
            ctx.fillStyle = "#555";
            ctx.fillRect(e.x, e.y - 15, e.w, 8);
            ctx.fillStyle = "#ff0000";
            ctx.fillRect(e.x, e.y - 15, (e.w * (e.hp / e.maxHp)), 8);
        }
    });

    // UI描画
    ctx.fillStyle = "#fff";
    ctx.font = "16px sans-serif";
    ctx.fillText(`SCORE: ${score}`, 10, 25);
    ctx.fillText(`WAVE: ${currentWave} / 5`, 10, 50);

    if (isClear) {
        ctx.fillStyle = "#00ff00";
        ctx.font = "36px sans-serif";
        ctx.fillText("ALL CLEAR!!", 140, 320);
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

spawnWave(1);
gameLoop();</script>
</body>
</html>
